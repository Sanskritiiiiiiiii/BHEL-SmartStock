version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mmis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmis_user
      POSTGRES_PASSWORD: mmis_password
      POSTGRES_DB: mmis_db
    ports:
      - "5432:5432"
    volumes:
      - mmis_postgres_data:/var/lib/postgresql/data

volumes:
  mmis_postgres_data:
